name: Pionex Monitor Universe + Kline Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */6 * * *"

permissions:
  contents: read

concurrency:
  group: pionex-monitor-symbol-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      MONITOR_KLINE_LIMIT: "180"
      PIONEX_REQUEST_INTERVAL: "0.85"
      PIONEX_429_COOLDOWN: "45"
      MONITOR_KLINE_BATCH: "20"
      MONITOR_CACHE_FRESH_HOURS: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests
      - name: Sync Pionex universe and prewarm 1D Klines into R2
        run: python engine/pionex_monitor_symbols_sync.py
      - name: Upload sync artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pionex-monitor-sync-${{ github.run_id }}
          path: |
            output/pionex_monitor_universe.json
            output/pionex_monitor_kline_sync_report.json
          if-no-files-found: warn
          retention-days: 7
