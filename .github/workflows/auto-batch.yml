name: Auto Market Batch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pair = Crypto → US-stock；us-stock-only = 只跑美股"
        required: true
        default: pair
        type: choice
        options:
          - pair
          - us-stock-only
      batch_id:
        description: "Cloudflare 自動排程 batch_id"
        required: true
        type: string

permissions:
  contents: read

# Auto batches themselves never overlap. Manual runs remain two independent market lanes.
concurrency:
  group: auto-market-batch
  cancel-in-progress: false
  queue: max

jobs:
  crypto:
    if: ${{ inputs.mode == 'pair' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: full-analysis-crypto
      cancel-in-progress: false
      queue: max
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      BATCH_ID: ${{ inputs.batch_id }}
      RUN_ID: ${{ inputs.batch_id }}_crypto
      MARKET: crypto

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Auto status | Crypto running
        shell: bash
        run: |
          BODY=$(jq -nc --arg id "$BATCH_ID" '{batch_id:$id,mode:"pair",status:"RUNNING",phase:"CRYPTO",message:"自動排程分析進行中：目前加密貨幣；完成後自動分析美股代幣"}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/automation/status"

      - name: Load active probability model
        shell: bash
        run: |
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/model/active" -o /tmp/probability_model.json || true
          if [ -s /tmp/probability_model.json ]; then mv /tmp/probability_model.json engine/models/probability_model.json; fi

      - name: Load previous Crypto snapshot
        shell: bash
        run: |
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/snapshot?market=crypto" -o /tmp/snapshot_ai.json || true
          if [ -s /tmp/snapshot_ai.json ]; then cp /tmp/snapshot_ai.json engine/snapshot_ai.json; elif [ -f data/bootstrap/snapshot_ai.json ]; then cp data/bootstrap/snapshot_ai.json engine/snapshot_ai.json; fi

      - name: Analyze Crypto
        run: |
          mkdir -p output
          python engine/run_analysis.py --market crypto --output-dir ../output --workers 2 --progress-file ../output/progress_crypto.json

      - name: Upload Crypto snapshot to R2
        shell: bash
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/snapshot_ai.json" \
            "$WORKER_BASE_URL/api/internal/snapshot?market=crypto&run_id=$RUN_ID"

      - name: Upload Crypto artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-crypto-${{ github.run_id }}
          path: output/*.json
          if-no-files-found: warn
          retention-days: 14

  us_stock:
    needs: crypto
    if: ${{ always() && (inputs.mode == 'us-stock-only' || needs.crypto.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: full-analysis-us-stock
      cancel-in-progress: false
      queue: max
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      BATCH_ID: ${{ inputs.batch_id }}
      RUN_ID: ${{ inputs.batch_id }}_us_stock
      MARKET: us-stock
      MODE: ${{ inputs.mode }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt

      - name: Auto status | US-stock running
        shell: bash
        run: |
          BODY=$(jq -nc --arg id "$BATCH_ID" --arg mode "$MODE" '{batch_id:$id,mode:$mode,status:"RUNNING",phase:"US_STOCK",message:"自動排程分析進行中：目前美股代幣"}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/automation/status"

      - name: Load active probability model
        shell: bash
        run: |
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/model/active" -o /tmp/probability_model.json || true
          if [ -s /tmp/probability_model.json ]; then mv /tmp/probability_model.json engine/models/probability_model.json; fi

      - name: Load previous US-stock snapshot
        shell: bash
        run: |
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/snapshot?market=us-stock" -o /tmp/snapshot_us_stock_ai.json || true
          if [ -s /tmp/snapshot_us_stock_ai.json ]; then cp /tmp/snapshot_us_stock_ai.json engine/snapshot_us_stock_ai.json; elif [ -f data/bootstrap/snapshot_us_stock_ai.json ]; then cp data/bootstrap/snapshot_us_stock_ai.json engine/snapshot_us_stock_ai.json; fi

      - name: Analyze US-stock
        run: |
          mkdir -p output
          python engine/run_analysis.py --market us-stock --output-dir ../output --workers 2 --progress-file ../output/progress_us_stock.json

      - name: Upload US-stock snapshot to R2
        shell: bash
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/snapshot_us_stock_ai.json" \
            "$WORKER_BASE_URL/api/internal/snapshot?market=us-stock&run_id=$RUN_ID"

      - name: GPT-OSS 120B | S3/S0.5/S1 research (24H cache)
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "$WORKER_BASE_URL/api/research/us-stock/cache" \
            -o /tmp/us_stock_research_cache.json || echo '{"schema_version":"1.0","ttl_hours":24,"entries":{}}' > /tmp/us_stock_research_cache.json
          python engine/us_stock_research.py \
            --snapshot output/snapshot_us_stock_ai.json \
            --cache /tmp/us_stock_research_cache.json \
            --out-cache output/us_stock_research_cache.json \
            --out-latest output/us_stock_research_latest.json

      - name: Upload GPT-OSS research to R2
        continue-on-error: true
        shell: bash
        run: |
          if [ -s output/us_stock_research_cache.json ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@output/us_stock_research_cache.json" \
              "$WORKER_BASE_URL/api/internal/research/us-stock/cache"
          fi
          if [ -s output/us_stock_research_latest.json ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@output/us_stock_research_latest.json" \
              "$WORKER_BASE_URL/api/internal/research/us-stock/latest"
          fi

      - name: Upload US-stock artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-us-stock-${{ github.run_id }}
          path: output/*.json
          if-no-files-found: warn
          retention-days: 14

  finish:
    needs: [crypto, us_stock]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      BATCH_ID: ${{ inputs.batch_id }}
      MODE: ${{ inputs.mode }}
      CRYPTO_RESULT: ${{ needs.crypto.result }}
      STOCK_RESULT: ${{ needs.us_stock.result }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "1880226268"
    steps:
      - name: Finalize Auto Batch status
        shell: bash
        run: |
          SUCCESS=false
          if [ "$MODE" = "pair" ] && [ "$CRYPTO_RESULT" = "success" ] && [ "$STOCK_RESULT" = "success" ]; then SUCCESS=true; fi
          if [ "$MODE" = "us-stock-only" ] && [ "$STOCK_RESULT" = "success" ]; then SUCCESS=true; fi

          if [ "$SUCCESS" = "true" ]; then
            BODY=$(jq -nc --arg id "$BATCH_ID" --arg mode "$MODE" '{batch_id:$id,mode:$mode,status:"SUCCESS",phase:"COMPLETE",message:"自動排程分析完成"}')
          else
            BODY=$(jq -nc --arg id "$BATCH_ID" --arg mode "$MODE" --arg c "$CRYPTO_RESULT" --arg s "$STOCK_RESULT" '{batch_id:$id,mode:$mode,status:"FAILED",phase:"FAILED",message:("自動排程失敗｜Crypto="+$c+"｜US-stock="+$s)}')
          fi
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/automation/status" || true
          [ "$SUCCESS" = "true" ]

      - name: Telegram | Auto batch completed
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN 尚未設定，略過 Telegram 通知"
            exit 0
          fi

          NOW=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')

          snapshot_summary() {
            local file="$1"
            local label="$2"
            local count s3 s05 s1 s2 s0 other
            count=$(jq -r '.batch.count // (.records | length) // 0' "$file")
            s3=$(jq -r '.breadth.market_state.S3 // 0' "$file")
            s05=$(jq -r '.breadth.market_state["S0.5"] // 0' "$file")
            s1=$(jq -r '.breadth.market_state.S1 // 0' "$file")
            s2=$(jq -r '.breadth.market_state.S2 // 0' "$file")
            s0=$(jq -r '.breadth.market_state.S0 // 0' "$file")
            other=$(jq -r '.breadth.market_state.OTHER // 0' "$file")
            printf '%s：%s 標的｜S3 %s｜S0.5 %s｜S1 %s｜S2 %s｜S0 %s｜OTHER %s' \
              "$label" "$count" "$s3" "$s05" "$s1" "$s2" "$s0" "$other"
          }

          if [ "$MODE" = "pair" ]; then
            curl --fail --silent --show-error "$WORKER_BASE_URL/api/snapshot?market=crypto" -o /tmp/tg_crypto.json
            curl --fail --silent --show-error "$WORKER_BASE_URL/api/snapshot?market=us-stock" -o /tmp/tg_stock.json
            CRYPTO_LINE=$(snapshot_summary /tmp/tg_crypto.json '🪙 加密貨幣')
            STOCK_LINE=$(snapshot_summary /tmp/tg_stock.json '🇺🇸 美股代幣')
            BATCH_LABEL='Crypto → US-stock'
            MESSAGE=$(printf '📊 SState Market Terminal\n✅ 自動排程完整分析完成\n來源：⏰ 自動排程\n批次：%s\n時間：%s\n%s\n%s\nR2：最新資料已更新' \
              "$BATCH_LABEL" "$NOW" "$CRYPTO_LINE" "$STOCK_LINE")
          else
            curl --fail --silent --show-error "$WORKER_BASE_URL/api/snapshot?market=us-stock" -o /tmp/tg_stock.json
            STOCK_LINE=$(snapshot_summary /tmp/tg_stock.json '🇺🇸 美股代幣')
            BATCH_LABEL='US-stock only（21:31）'
            MESSAGE=$(printf '📊 SState Market Terminal\n✅ 自動排程完整分析完成\n來源：⏰ 自動排程\n批次：%s\n時間：%s\n%s\nR2：最新資料已更新' \
              "$BATCH_LABEL" "$NOW" "$STOCK_LINE")
          fi

          jq -nc \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id:$chat_id,text:$text,disable_web_page_preview:true}' \
          | curl --fail --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

