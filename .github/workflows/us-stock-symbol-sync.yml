name: Daily Pionex US-stock Symbol Sync

on:
  schedule:
    # GitHub Actions cron uses UTC. 22:00 UTC = 06:00 Asia/Taipei (next calendar day).
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-stock-symbol-sync-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Sync Pionex US-stock symbols to R2
        run: |
          mkdir -p output
          python engine/us_stock_symbols_sync.py \
            --output output/us_stock_symbols.json

      - name: Upload symbol-list artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-stock-symbols-${{ github.run_id }}
          path: output/us_stock_symbols.json
          if-no-files-found: warn
          retention-days: 7
