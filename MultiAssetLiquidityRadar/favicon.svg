<svg xmlns="http://www.w3.org/2000/svg" width="600" height="690" viewBox="0 0 600 690" role="img" aria-label="MultiAssetLiquidityRadar radar icon">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2A5F"/>
      <stop offset="100%" stop-color="#0A1D47"/>
    </linearGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#75F0EE"/>
      <stop offset="100%" stop-color="#35C9D4"/>
    </linearGradient>
  </defs>

  <!-- Same 600 x 690 canvas and badge silhouette as SStateMarketTerminal -->
  <rect x="11" y="13" width="578" height="665" rx="118" fill="#4E6A96"/>
  <rect x="28" y="30" width="544" height="630" rx="102" fill="url(#navy)"/>

  <!-- Radar sweep: one clear shape that survives a 16 px browser tab -->
  <circle cx="300" cy="345" r="182" fill="none" stroke="url(#aqua)" stroke-width="32"/>
  <path d="M300 345 L414 227" fill="none" stroke="#5CE8E8" stroke-width="37" stroke-linecap="round"/>
  <circle cx="300" cy="345" r="47" fill="#D9FFFD"/>

  <!-- Upper / lower liquidation zones: yellow above, purple below -->
  <path d="M159 258 H229" fill="none" stroke="#FFE549" stroke-width="43" stroke-linecap="round"/>
  <path d="M371 443 H441" fill="none" stroke="#C78EFF" stroke-width="43" stroke-linecap="round"/>
</svg>
