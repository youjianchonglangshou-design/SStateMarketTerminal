name: Test BTC Pionex Worker Proxy
on:
  push:
    branches: [btc-pionex-proxy-20261007]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: btc-pionex-proxy-20261007
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start local Worker
        shell: bash
        run: |
          cat > wrangler.btc-test.toml <<'TOML'
          name = "sstate-btc-proxy-test"
          main = "cloudflare/worker.js"
          compatibility_date = "2026-10-07"
          [[r2_buckets]]
          binding = "JSON_BUCKET"
          bucket_name = "local-test"
          TOML
          npx --yes wrangler@4 dev --local --port 8787 --config wrangler.btc-test.toml >/tmp/worker.log 2>&1 &
          echo $! >/tmp/worker.pid
          for i in $(seq 1 40); do
            if curl -sS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/worker.log
          exit 1
      - name: Verify 15M and 1D proxy with CORS
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://youjianchonglangshou-design.github.io'
          for I in 15M 1D; do
            URL="http://127.0.0.1:8787/api/monitor/klines?symbol=BTC_USDT_PERP&interval=$I&limit=30&refresh=1"
            curl --fail --silent --show-error -D "/tmp/h_$I.txt" -H "Origin: $ORIGIN" "$URL" -o "/tmp/b_$I.json"
            grep -Eqi '^access-control-allow-origin: (\\*|https://youjianchonglangshou-design.github.io)' "/tmp/h_$I.txt"
            echo "--- $I headers ---"
            grep -i '^access-control-allow-origin:' "/tmp/h_$I.txt" || true
            echo "--- $I body ---"
            cat "/tmp/b_$I.json"
            python - "$I" "/tmp/b_$I.json" <<'PY'
          import json,sys
          interval,path=sys.argv[1:3]
          j=json.load(open(path))
          assert j.get("ok") is True, j
          rows=j.get("klines",[])
          assert len(rows)==30, (interval,len(rows),j)
          ts=[int(x["time"]) for x in rows]
          assert ts==sorted(ts), interval
          print(interval,"PASS",len(rows),rows[-1]["close"],j.get("source"))
          PY
          done
      - name: Show Worker log on failure
        if: failure()
        run: cat /tmp/worker.log || true
