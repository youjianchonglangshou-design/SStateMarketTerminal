<!DOCTYPE html>

<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<link href="./favicon.svg" rel="icon" type="image/svg+xml"/>
<meta content="#1e293b" name="theme-color"/>
<title>SStateMarketTerminal</title>
<link href="styles.css?v=0.3.08" rel="stylesheet"/>
<link href="research-modal.css" rel="stylesheet"/>
</head>
<body>
<main class="shell">
<header class="topbar terminal-heading">
<div class="brand">
<div class="premium-title-line">
<h1>SState Market Terminal</h1>
<span class="version-chip-minimal" id="version-chip"></span>
</div>
<div class="update-time-line" id="system-caption">載入更新時間...</div>
</div>

</header>
<section aria-label="市場搜尋與 S-state 快速篩選" class="sticky-control-deck">
<div class="actions sticky-actions">
<select aria-label="市場" id="market-select">
<option value="crypto">加密貨幣</option>
<option value="us-stock">美股代幣</option>
</select>
<div class="search-box"><span>⌕</span><input autocomplete="off" id="symbol-search" placeholder="搜尋標的、S-state或產業" spellcheck="false" type="search"/></div>
<a class="performance-link" href="./monitor.html" id="monitor-link" rel="noopener noreferrer" target="_blank" title="在新分頁開啟 Pionex 即時標的監控">📡 即時監控</a>
<button class="primary" id="run-button">📝 完整分析</button>
<details class="more-menu">
<summary>更多 ⋯</summary>
<div class="more-menu-panel">
<a class="more-menu-link" href="./performance.html" rel="noopener noreferrer" target="_blank" title="Champion 凍結快照正式結算戰績">📊 近期戰績</a>
<button id="download-button" title="下載目前選取市場的最新 JSON">⬇ 加密 JSON</button>
<button class="research-download-button hidden" id="research-download-button" title="下載 R2 research/us-stock/latest.json" type="button">⬇ 新聞 JSON</button>
</div>
</details>
</div>
<div class="sticky-filter-row">
<div class="sticky-scan-meta">
<strong>快速狀態掃描</strong>
<span class="caption" id="snapshot-meta"></span>
</div>
<div class="filters" id="state-filters"></div>
</div>
</section>
<section class="signal-matrix-panel collapsed" id="signal-matrix">
<div class="signal-matrix-head">
<div class="signal-matrix-heading-wrap">
<button aria-controls="signal-matrix-body" aria-expanded="false" class="signal-matrix-toggle" id="signal-matrix-toggle" title="展開 S狀態條件觀察表" type="button">
<span class="signal-matrix-arrow">▶</span>
</button>
<div>
<div class="signal-matrix-title">📋 SIGNAL MATRIX｜S狀態條件觀察表</div>
<div class="caption" id="signal-matrix-caption">載入目前市場快照...</div>
</div>
</div>
<div class="signal-matrix-summary waiting" id="signal-matrix-summary">WAITING</div>
</div>
<div class="signal-matrix-body hidden" id="signal-matrix-body">
<div class="signal-matrix-table-wrap" id="signal-matrix-table-wrap"></div>
<div class="signal-matrix-footnote">平均K = 最新日線 Heikin-Ashi 顏色；CCI-SMA = CCI20 的 SMA14 最新階梯顏色。黃色＋黃色可快速辨識「雙黃」條件；所有欄位皆可點擊排序。</div>
</div>
</section>

<section class="run-panel hidden" id="run-panel">
<div class="run-line">
<strong id="run-title">分析準備中</strong>
<span id="run-percent">0%</span>
</div>
<div aria-label="完整分析進度" class="volume-progress" id="run-bar"></div>
<div class="caption" id="run-detail"></div>
</section>
<section class="summary-strip" id="summary-strip"></section>
<section class="cards" id="cards"></section>
<section class="empty hidden" id="empty-state">
<h3>尚無可顯示資料</h3>
<p>網站預設只讀取最後一次成功結果。設定 Worker 後，選擇市場並按「完整分析」才會重新抓取 Pionex 並執行 Python 引擎。</p>
</section>
</main>
<button aria-hidden="true" class="signal-matrix-return hidden" disabled="" id="signal-matrix-return" title="返回 SIGNAL MATRIX 表格" type="button">
<span class="signal-matrix-return-icon">↩</span>
<span class="signal-matrix-return-label">返回</span>
</button>



<div class="toast hidden" id="toast"></div>
<script src="config.js?v=0.3.08"></script>
<script src="app.js?v=0.3.08"></script>
<script src="research-modal.js"></script>
<script src="research-download.js"></script>
</body>
</html>
