name: US Sector Flow HUD

on:
  # 每日 21:31（台灣）由 Cloudflare Worker 的 31 13 * * * 觸發。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-sector-flow-hud
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r engine/requirements.txt
          pip install "selenium>=4.35,<5"

      - name: Load previous sector-flow history
        shell: bash
        run: |
          mkdir -p output
          curl --fail --silent --show-error \
            "$WORKER_BASE_URL/api/sector-flow" \
            -o output/sector_flow_previous.json || true
          if [ ! -s output/sector_flow_previous.json ]; then
            printf '{}' > output/sector_flow_previous.json
          fi

      - name: Collect ETF Central sector flows
        run: |
          python engine/sector_flow.py \
            --previous output/sector_flow_previous.json \
            --output output/sector_flow.json

      - name: Upload latest sector flow to R2
        shell: bash
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/sector_flow.json" \
            "$WORKER_BASE_URL/api/internal/sector-flow"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-flow-${{ github.run_id }}
          path: output/sector_flow*.json
          if-no-files-found: warn
          retention-days: 14
