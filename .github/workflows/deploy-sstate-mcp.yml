name: Deploy SState MCP
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: deploy-sstate-mcp
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test MCP with original indicator engine
        run: node mcp/test.mjs
      - name: Embed triggering commit in independent Worker
        run: |
          printf '\nDEPLOY_COMMIT = "%s"\n' "$GITHUB_SHA" >> mcp/wrangler.toml
      - name: Deploy independent sstate-mcp Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.45.0'
          workingDirectory: mcp
          command: deploy --config wrangler.toml
      - name: Verify deployment health and MCP tools
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://sstate-mcp.youjianchonglangshou.workers.dev"
          EXPECTED_COMMIT="$GITHUB_SHA"
          for attempt in $(seq 1 18); do
            curl -fsS --max-time 10 "$URL/health" > health.json || true
            CURRENT=$(node -e "try{console.log(require('./health.json').deploy_commit||'')}catch(e){console.log('')}")
            echo "Waiting for deployed commit $EXPECTED_COMMIT; served $CURRENT; attempt $attempt"
            if [ "$CURRENT" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 3
          done
          [ "$CURRENT" = "$EXPECTED_COMMIT" ] || { echo "Worker deployment did not propagate to expected Git commit"; exit 1; }
          cat health.json
          curl -fsS --retry 3 --retry-delay 3 -X POST "$URL/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' > mcp-tools.json
          node -e 'const p=require("./mcp-tools.json"); if(!Array.isArray(p.result?.tools)||p.result.tools.length<10)process.exit(1); console.log("MCP tools online:",p.result.tools.map(x=>x.name).join(", "))'

      - name: Probe CMC sentiment and CoinGlass bounds (provider-dependent, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://sstate-mcp.youjianchonglangshou.workers.dev/mcp"
          curl -fsS --max-time 35 -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"get_fear_greed_today","arguments":{}}}' > mcp-cmc.json
          node - <<'NODE'
          const p=require('./mcp-cmc.json'),d=p.result?.structuredContent;
          console.log('CMC latest:',JSON.stringify({available:d?.available,value:d?.value,category:d?.category,source_date:d?.source_date_taipei,warnings:d?.warnings}));
          if(p.result?.isError||!d)process.exit(1);
          NODE
          curl -fsS --max-time 35 -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"get_liquidation_bounds","arguments":{"symbol":"BTC","allow_proxy":true}}}' > mcp-liq.json
          node - <<'NODE'
          const p=require('./mcp-liq.json'),d=p.result?.structuredContent;
          console.log('BTC liquidation:',JSON.stringify({available:d?.available,source:d?.source,is_estimate:d?.is_estimate,upper:d?.upper,lower:d?.lower,reasons:d?.reasons}));
          if(p.result?.isError||!d)process.exit(1);
          NODE

      - name: Probe live BTC indicator availability (external data, non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail
          URL="https://sstate-mcp.youjianchonglangshou.workers.dev/mcp"
          curl -fsS --max-time 35 -X POST "$URL" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_market_states","arguments":{"symbols":["BTC"],"use_live":true}}}' > mcp-btc.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('mcp-btc.json','utf8'));
          const data = p.result?.structuredContent;
          const row = data?.results?.[0];
          console.log('BTC Live MCP:', JSON.stringify({success:data?.success,symbol:row?.symbol,s_state:row?.s_state,midline:row?.midline,average_k:row?.average_k,cci_sma:row?.cci_sma,is_live_quote:row?.is_live_quote,quote_source:row?.quote_source,kline_source:row?.kline_source,error:row?.error}));
          if(!row || row.error || data.success!==1)process.exit(1);
          NODE
