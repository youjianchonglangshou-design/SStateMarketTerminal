name: Full Market Analysis

on:
  workflow_dispatch:
    inputs:
      market:
        description: "crypto 或 us-stock"
        required: true
        default: crypto
        type: choice
        options:
          - crypto
          - us-stock
      run_id:
        description: "Cloudflare 產生的 run_id；手動執行可留空"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: full-analysis-${{ inputs.market }}
  cancel-in-progress: false
  queue: max

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      MARKET: ${{ inputs.market }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: "1880226268"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve run id
        shell: bash
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "RUN_ID=manual_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Resolve snapshot filename
        id: names
        shell: bash
        run: |
          if [ "$MARKET" = "us-stock" ]; then
            echo "snapshot=snapshot_us_stock_ai.json" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=snapshot_ai.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Load active probability model from R2
        shell: bash
        run: |
          if [ -n "$WORKER_BASE_URL" ]; then
            curl --fail --silent --show-error \
              "$WORKER_BASE_URL/api/model/active" \
              -o /tmp/probability_model.json || true
            if [ -s /tmp/probability_model.json ]; then
              mv /tmp/probability_model.json engine/models/probability_model.json
              echo "Using R2 active probability model"
            else
              echo "R2 active model not seeded yet; using repository fallback"
            fi
          fi

      - name: Load previous snapshot for state history
        shell: bash
        run: |
          SNAP="${{ steps.names.outputs.snapshot }}"
          if [ -n "$WORKER_BASE_URL" ]; then
            curl --fail --silent --show-error \
              "$WORKER_BASE_URL/api/snapshot?market=$MARKET" \
              -o "/tmp/$SNAP" || true
          fi
          if [ -s "/tmp/$SNAP" ]; then
            cp "/tmp/$SNAP" "engine/$SNAP"
            echo "Previous snapshot loaded from R2"
          elif [ -f "data/bootstrap/$SNAP" ]; then
            cp "data/bootstrap/$SNAP" "engine/$SNAP"
            echo "Using repository bootstrap snapshot"
          fi

      - name: Run headless Python analysis
        run: |
          mkdir -p output
          python engine/run_analysis.py \
            --market "$MARKET" \
            --output-dir ../output \
            --workers 2 \
            --progress-file ../output/progress.json

      - name: Upload latest snapshot to Cloudflare R2
        if: ${{ success() }}
        shell: bash
        run: |
          SNAP="${{ steps.names.outputs.snapshot }}"
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/$SNAP" \
            "$WORKER_BASE_URL/api/internal/snapshot?market=$MARKET&run_id=$RUN_ID"

      - name: GPT-OSS 120B | US-stock S3/S0.5/S1 research (24H cache)
        if: ${{ success() && inputs.market == 'us-stock' }}
        continue-on-error: true
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "$WORKER_BASE_URL/api/research/us-stock/cache" \
            -o /tmp/us_stock_research_cache.json || echo '{"schema_version":"1.0","ttl_hours":24,"entries":{}}' > /tmp/us_stock_research_cache.json
          python engine/us_stock_research.py \
            --snapshot output/snapshot_us_stock_ai.json \
            --cache /tmp/us_stock_research_cache.json \
            --out-cache output/us_stock_research_cache.json \
            --out-latest output/us_stock_research_latest.json

      - name: Upload GPT-OSS research to R2
        if: ${{ success() && inputs.market == 'us-stock' }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -s output/us_stock_research_cache.json ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@output/us_stock_research_cache.json" \
              "$WORKER_BASE_URL/api/internal/research/us-stock/cache"
          fi
          if [ -s output/us_stock_research_latest.json ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@output/us_stock_research_latest.json" \
              "$WORKER_BASE_URL/api/internal/research/us-stock/latest"
          fi


      - name: Telegram | Manual analysis completed
        if: ${{ success() }}
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN 尚未設定，略過 Telegram 通知"
            exit 0
          fi

          SNAP="${{ steps.names.outputs.snapshot }}"
          if [ ! -s "output/$SNAP" ]; then
            echo "::warning::找不到 output/$SNAP，略過 Telegram 通知"
            exit 0
          fi

          if [ "$MARKET" = "us-stock" ]; then
            MARKET_LABEL="🇺🇸 美股代幣"
          else
            MARKET_LABEL="🪙 加密貨幣"
          fi

          TIME=$(jq -r '.batch.generated_at_taiwan // empty' "output/$SNAP")
          [ -n "$TIME" ] || TIME=$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')
          COUNT=$(jq -r '.batch.count // (.records | length) // 0' "output/$SNAP")
          S3=$(jq -r '.breadth.market_state.S3 // 0' "output/$SNAP")
          S05=$(jq -r '.breadth.market_state["S0.5"] // 0' "output/$SNAP")
          S1=$(jq -r '.breadth.market_state.S1 // 0' "output/$SNAP")
          S2=$(jq -r '.breadth.market_state.S2 // 0' "output/$SNAP")
          S0=$(jq -r '.breadth.market_state.S0 // 0' "output/$SNAP")
          OTHER=$(jq -r '.breadth.market_state.OTHER // 0' "output/$SNAP")

          MESSAGE=$(printf '📊 SState Market Terminal\n✅ 手動完整分析完成\n來源：👤 手動\n市場：%s\n時間：%s\n分析標的：%s\n狀態：S3 %s｜S0.5 %s｜S1 %s｜S2 %s｜S0 %s｜OTHER %s\nR2：最新資料已更新' \
            "$MARKET_LABEL" "$TIME" "$COUNT" "$S3" "$S05" "$S1" "$S2" "$S0" "$OTHER")

          jq -nc \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            '{chat_id:$chat_id,text:$text,disable_web_page_preview:true}' \
          | curl --fail --silent --show-error \
              -X POST \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sstate-${{ inputs.market }}-${{ github.run_id }}
          path: |
            output/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report failure to Cloudflare
        if: ${{ failure() }}
        shell: bash
        run: |
          BODY=$(jq -nc \
            --arg run_id "$RUN_ID" \
            --arg market "$MARKET" \
            --arg message "GitHub Actions full-analysis failed. Open run $GITHUB_RUN_ID for logs." \
            '{run_id:$run_id,market:$market,status:"FAILED",percent:0,message:$message}')
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status" || true
