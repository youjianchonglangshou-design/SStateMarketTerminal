<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ring" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sTop" x1="18" y1="16" x2="44" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff36a"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="sBottom" x1="18" y1="34" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark terminal tile -->
  <rect x="4" y="4" width="56" height="56" rx="14"
        fill="#0b1324" stroke="url(#ring)" stroke-width="2.4"/>

  <!-- circuit corner -->
  <path d="M10 22H15L18 18" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="10" cy="22" r="2" fill="#22d3ee"/>
  <path d="M46 48L50 52H55" fill="none" stroke="#a855f7" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="55" cy="52" r="2" fill="#a855f7"/>

  <!-- stylized S : S3 / ladder -->
  <path d="M18 17H45L40 23H25L21 27H38L44 33H24L17 26Z"
        fill="url(#sTop)" filter="url(#glow)"/>
  <path d="M20 34H43L47 39L42 45H24L19 50H46L39 56H14L21 45H37L41 41H25Z"
        fill="url(#sBottom)" filter="url(#glow)"/>

  <!-- mini candlesticks -->
  <g stroke-linecap="round">
    <line x1="31" y1="22" x2="31" y2="39" stroke="#67e8f9" stroke-width="1.5"/>
    <rect x="28.7" y="27" width="4.6" height="7" rx="1" fill="#22d3ee"/>
    <line x1="37" y1="19" x2="37" y2="38" stroke="#86efac" stroke-width="1.5"/>
    <rect x="34.7" y="23" width="4.6" height="9" rx="1" fill="#22c55e"/>
    <line x1="43" y1="15" x2="43" y2="36" stroke="#fde047" stroke-width="1.5"/>
    <rect x="40.7" y="20" width="4.6" height="10" rx="1" fill="#facc15"/>
  </g>
</svg>
