name: Check Cloudflare Deploy Secrets
on:
  push:
    branches: [btc-pionex-proxy-20261007]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence
        env:
          A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          B: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          C: ${{ secrets.CF_API_TOKEN }}
          D: ${{ secrets.CF_ACCOUNT_ID }}
        shell: bash
        run: |
          for name in A B C D; do
            if [ -n "${!name}" ]; then echo "$name=present"; else echo "$name=missing"; fi
          done
