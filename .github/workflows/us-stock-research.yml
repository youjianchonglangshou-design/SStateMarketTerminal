name: US Stock News Research Only

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Cloudflare 產生的 research run_id；手動執行可留空"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Share the US-stock lane with Full Analysis / Auto Batch so research cannot write
# research/latest.json at the same time as another US-stock run.
concurrency:
  group: full-analysis-us-stock
  cancel-in-progress: false
  queue: max

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve run id
        shell: bash
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "RUN_ID=research_manual_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Status | research running
        shell: bash
        run: |
          BODY=$(jq -nc --arg run_id "$RUN_ID" '{run_id:$run_id,market:"us-stock",task:"NEWS_RESEARCH_ONLY",status:"RUNNING",percent:10,message:"讀取 R2 最新美股 snapshot；不重跑 Pionex / S-state 引擎"}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status"

      - name: Load latest US-stock snapshot from R2
        shell: bash
        run: |
          mkdir -p output
          curl --fail --silent --show-error \
            "$WORKER_BASE_URL/api/snapshot?market=us-stock" \
            -o output/snapshot_us_stock_ai.json
          jq -e '.records | type == "array"' output/snapshot_us_stock_ai.json >/dev/null

      - name: Load 24H research cache from R2
        shell: bash
        run: |
          curl --fail --silent --show-error \
            "$WORKER_BASE_URL/api/research/us-stock/cache" \
            -o /tmp/us_stock_research_cache.json \
            || echo '{"schema_version":"1.1","ttl_hours":24,"entries":{}}' > /tmp/us_stock_research_cache.json

      - name: Status | GPT-OSS research
        shell: bash
        run: |
          BODY=$(jq -nc --arg run_id "$RUN_ID" '{run_id:$run_id,market:"us-stock",task:"NEWS_RESEARCH_ONLY",status:"RUNNING",percent:25,message:"GPT-OSS 120B 新聞分析中｜沿用既有 24H Cache 規則"}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status"

      - name: GPT-OSS 120B | S3/S0.5/S1 research only
        shell: bash
        run: |
          python engine/us_stock_research.py \
            --snapshot output/snapshot_us_stock_ai.json \
            --cache /tmp/us_stock_research_cache.json \
            --out-cache output/us_stock_research_cache.json \
            --out-latest output/us_stock_research_latest.json

      - name: Upload research to R2
        shell: bash
        run: |
          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/us_stock_research_cache.json" \
            "$WORKER_BASE_URL/api/internal/research/us-stock/cache"

          curl --fail --silent --show-error -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/us_stock_research_latest.json" \
            "$WORKER_BASE_URL/api/internal/research/us-stock/latest"

      - name: Status | research completed
        shell: bash
        run: |
          NEW=$(jq -r '.new_search_count // 0' output/us_stock_research_latest.json)
          CACHE=$(jq -r '.cache_hit_count // 0' output/us_stock_research_latest.json)
          ERR=$(jq -r '.error_count // 0' output/us_stock_research_latest.json)
          DEFER=$(jq -r '.deferred_count // 0' output/us_stock_research_latest.json)
          MESSAGE="新聞分析完成｜NEW ${NEW}｜CACHE ${CACHE}｜ERROR ${ERR}｜DEFERRED ${DEFER}"
          BODY=$(jq -nc --arg run_id "$RUN_ID" --arg message "$MESSAGE" '{run_id:$run_id,market:"us-stock",task:"NEWS_RESEARCH_ONLY",status:"SUCCESS",percent:100,message:$message}')
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status"

      - name: Upload research artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-stock-news-${{ github.run_id }}
          path: |
            output/us_stock_research_*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report failure to Cloudflare
        if: ${{ failure() }}
        shell: bash
        run: |
          BODY=$(jq -nc \
            --arg run_id "$RUN_ID" \
            --arg message "GitHub Actions us-stock-research failed. Open run $GITHUB_RUN_ID for logs." \
            '{run_id:$run_id,market:"us-stock",task:"NEWS_RESEARCH_ONLY",status:"FAILED",percent:0,message:$message}')
          curl --silent --show-error -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status" || true
