name: Full Market Analysis

on:
  workflow_dispatch:
    inputs:
      market:
        description: "crypto 或 us-stock"
        required: true
        default: crypto
        type: choice
        options:
          - crypto
          - us-stock
      run_id:
        description: "Cloudflare 產生的 run_id；手動執行可留空"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: full-analysis-${{ inputs.market }}
  cancel-in-progress: false
  queue: max

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      RUN_ID: ${{ inputs.run_id }}
      MARKET: ${{ inputs.market }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve run id
        shell: bash
        run: |
          if [ -z "$RUN_ID" ]; then
            echo "RUN_ID=manual_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install engine dependencies
        run: pip install -r engine/requirements.txt

      - name: Resolve snapshot filename
        id: names
        shell: bash
        run: |
          if [ "$MARKET" = "us-stock" ]; then
            echo "snapshot=snapshot_us_stock_ai.json" >> "$GITHUB_OUTPUT"
          else
            echo "snapshot=snapshot_ai.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Load active probability model from R2
        shell: bash
        run: |
          if [ -n "$WORKER_BASE_URL" ]; then
            curl --fail --silent --show-error \
              "$WORKER_BASE_URL/api/model/active" \
              -o /tmp/probability_model.json || true
            if [ -s /tmp/probability_model.json ]; then
              mv /tmp/probability_model.json engine/models/probability_model.json
              echo "Using R2 active probability model"
            else
              echo "R2 active model not seeded yet; using repository fallback"
            fi
          fi

      - name: Load previous snapshot for state history
        shell: bash
        run: |
          SNAP="${{ steps.names.outputs.snapshot }}"
          if [ -n "$WORKER_BASE_URL" ]; then
            curl --fail --silent --show-error \
              "$WORKER_BASE_URL/api/snapshot?market=$MARKET" \
              -o "/tmp/$SNAP" || true
          fi
          if [ -s "/tmp/$SNAP" ]; then
            cp "/tmp/$SNAP" "engine/$SNAP"
            echo "Previous snapshot loaded from R2"
          elif [ -f "data/bootstrap/$SNAP" ]; then
            cp "data/bootstrap/$SNAP" "engine/$SNAP"
            echo "Using repository bootstrap snapshot"
          fi

      - name: Run headless Python analysis
        run: |
          mkdir -p output
          python engine/run_analysis.py \
            --market "$MARKET" \
            --output-dir ../output \
            --workers 2 \
            --progress-file ../output/progress.json

      - name: Upload latest snapshot to Cloudflare R2
        if: ${{ success() }}
        shell: bash
        run: |
          SNAP="${{ steps.names.outputs.snapshot }}"
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@output/$SNAP" \
            "$WORKER_BASE_URL/api/internal/snapshot?market=$MARKET&run_id=$RUN_ID"

      - name: Upload analysis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sstate-${{ inputs.market }}-${{ github.run_id }}
          path: |
            output/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Report failure to Cloudflare
        if: ${{ failure() }}
        shell: bash
        run: |
          BODY=$(jq -nc \
            --arg run_id "$RUN_ID" \
            --arg market "$MARKET" \
            --arg message "GitHub Actions full-analysis failed. Open run $GITHUB_RUN_ID for logs." \
            '{run_id:$run_id,market:$market,status:"FAILED",percent:0,message:$message}')
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/status" || true
